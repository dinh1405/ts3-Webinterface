# nginx-Direktiven für die Plesk-Subdomain (z. B. ts.example.org)
#
# Variante A (CLI, so wurde es hier eingerichtet):
#   cp deploy/nginx-plesk.conf /var/www/vhosts/system/ts.example.org/conf/vhost_nginx.conf
#   plesk bin site -u ts.example.org -ssl-redirect true
#   plesk sbin httpdmng --reconfigure-domain ts.example.org
#
# Variante B (Plesk-Oberfläche): Websites & Domains → <Subdomain> → Apache & nginx Einstellungen
#   → "Zusätzliche nginx-Direktiven" = Inhalt dieser Datei; "Statische Dateien direkt durch
#   nginx bereitstellen" muss deaktiviert bleiben, damit /assets/* nicht aus httpdocs kommt.
#
# Die regex-Location gewinnt gegen Plesks "location /" (Apache-Proxy); die ACME-Challenge-
# Locations (^~) für Let's-Encrypt-Verlängerungen bleiben davon unberührt.

location ~ ^/ {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Server-Sent Events (Live-Ereignisse) und große Backup-Downloads
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 4096m;
}
